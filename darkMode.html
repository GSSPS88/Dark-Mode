<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dark mode & light mode workshop</title>
        <link rel="stylesheet" href="darkMode.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="theme-switch-container">
        <span id="toggle-icon">
            <span class="toggle-text">light mode</span>
                <i class="bi bi-brightness-high-fill"></i>
               <!-- <i class="bi bi-moon-stars-fill"></i> -->
        </span>
            <label class="theme-switch">
                <input type="checkbox">
                <div class="slider round"></div>
            </label>
    </div>
    <nav id="nav">
        <a href="#home">Home</a>
        <a href="#project">Project</a>
        <a href="#contact">Contact</a>
    </nav>
    <section id="home">
        <div class="title-group">
            <h1>Sathaphone Savayvanh</h1>
            <h2>Web Developer and Graphic Design</h2>
        </div>
    </section>
    <section id="project">
        <h1>My Projects</h1>
        <div class="project-container">
            <div class="image-container">
                <h2>Web</h2>
                <img src="img/undraw_web_devices_re_m8sc_light.svg" alt="" id="image1">
            </div>
            <div class="image-container">
                <h2>Graphic design</h2>
                <img src="img/undraw_winter_designer_a-2-m7_light.svg" alt="" id="image2">
            </div>
            <div class="image-container">
                <h2>freelance</h2>
                <img src="img/undraw_freelancer_re_irh4_light.svg" alt="" id="image3">
            </div>
        </div>
    </section>

    <section id="contact">
        <div class="social-icon">
            <i class="bi2 bi-facebook"></i>
            <i class="bi2 bi-whatsapp"></i>
            <i class="bi2 bi-instagram"></i>
            <i class="bi2 bi-github"></i>
        </div>
    </section>
    
    <script src="darkMode.js"></script>
</body>
</html>
